name: Deploy to Hostinger

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # NEXT_PUBLIC_* se inlinea en build (static export). Si el secret no existe
          # todavia, queda vacio y <GoogleAnalytics /> no monta nada (safe default).
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.223.77.154
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          # Probing the real docroot: domain may be served from a domain-scoped
          # folder instead of account-root /public_html/. dangerous-clean-slate
          # stays false (default) so this first run only ADDS files — nothing is
          # deleted if the path is wrong. Revert/clean up in a follow-up commit.
          server-dir: /public_html/notaryaplus.com/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            backend/**
            backend
            .ftp-deploy-sync-state.json
